<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="textus-resource:panel.css" />
  </head>
  <body>
    <div class="toolbar">
      <span id="name"></span>
      <span class="grow"></span>
      <button id="full" type="button">全图</button>
      <button id="export" type="button">导出图片</button>
      <div class="zoom">
        <button id="zoom-out" type="button">−</button>
        <span id="zoom-label">100%</span>
        <button id="zoom-in" type="button">+</button>
      </div>
    </div>
    <div id="map"></div>
    <p id="empty" hidden></p>
    <script src="textus-resource:panel.js"></script>
  </body>
</html>
