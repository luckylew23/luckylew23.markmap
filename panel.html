<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="textus-resource:panel.css" />
  </head>
  <body>
    <div class="toolbar">
      <span id="name"></span>
      <span class="grow"></span>
      <button id="full" type="button" title="在新标签页里看整张图">全图</button>
      <button id="export" type="button" title="把这张图存成图片，放在笔记旁边">导出图片</button>
      <div class="zoom">
        <button id="zoom-out" type="button" title="缩小">−</button>
        <span id="zoom-label">100%</span>
        <button id="zoom-in" type="button" title="放大">+</button>
      </div>
    </div>
    <div id="map"></div>
    <p id="empty" hidden>这篇笔记里还没有标题或列表。</p>
    <script src="textus-resource:panel.js"></script>
  </body>
</html>
